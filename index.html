<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Land Sliders 3D</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #87ceeb; touch-action: none; font-family: 'Segoe UI', Arial, sans-serif; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; padding: 14px 18px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    pointer-events: none; user-select: none; z-index: 10;
  }
  .badge {
    background: rgba(255,255,255,0.85); border-radius: 14px; padding: 8px 16px;
    font-size: 20px; font-weight: 700; color: #2c5530; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  #modeBtn {
    pointer-events: auto; cursor: pointer; border: none; font-family: inherit;
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    z-index: 10; font-size: 16px;
  }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 20;
    background: rgba(20,40,30,0.55); color: #fff; text-align: center;
  }
  #overlay h1 { font-size: 48px; margin: 0 0 10px; text-shadow: 0 3px 10px rgba(0,0,0,0.5); }
  #overlay p { font-size: 19px; max-width: 500px; margin: 5px 20px; }
  #overlay button {
    margin-top: 22px; font-size: 24px; font-weight: 700; padding: 14px 44px;
    border: none; border-radius: 30px; background: #ffb627; color: #5a3a00;
    cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  #overlay button:active { transform: scale(0.96); }
  #toast {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.9); color: #2c5530; font-size: 22px; font-weight: 700;
    padding: 10px 24px; border-radius: 20px; opacity: 0; transition: opacity 0.4s; z-index: 15;
    pointer-events: none;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="hud">
  <div class="badge" id="scoreBadge">⭐ 0 / 0</div>
  <div class="badge" id="levelBadge">Level 1</div>
  <div class="badge" id="livesBadge">❤️❤️❤️</div>
</div>
<button class="badge" id="modeBtn">🌍 Welt sliden</button>
<div id="toast"></div>
<div id="overlay">
  <h1>🏔️ Land Sliders 3D</h1>
  <p><b>Wischen</b> verschiebt die Welt unter der Figur — lange, schnelle Swipes geben Schwung, kurze langsame bewegen präzise.</p>
  <p><b>Tippen</b> stoppt sofort. Mit genug Tempo kannst du über Löcher rutschen — aber fall nicht von der Insel!</p>
  <button id="startBtn">Spielen</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ---------- Renderer / Szene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 60, 140);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 300);

const sun = new THREE.DirectionalLight(0xfff4e0, 2.2);
sun.position.set(20, 35, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xbfd8ff, 0.9));

// Meer unter der Insel
const sea = new THREE.Mesh(
  new THREE.CircleGeometry(200, 48),
  new THREE.MeshLambertMaterial({ color: 0x2d7fc1 })
);
sea.rotation.x = -Math.PI / 2;
sea.position.y = -8;
scene.add(sea);

// Wolken
for (let i = 0; i < 12; i++) {
  const cloud = new THREE.Group();
  for (let j = 0; j < 3; j++) {
    const puff = new THREE.Mesh(
      new THREE.SphereGeometry(1.6 + Math.random() * 1.4, 7, 6),
      new THREE.MeshLambertMaterial({ color: 0xffffff })
    );
    puff.position.set(j * 1.8 - 1.8, Math.random() * 0.5, Math.random() * 1.2);
    cloud.add(puff);
  }
  const a = Math.random() * Math.PI * 2;
  const r = 45 + Math.random() * 50;
  cloud.position.set(Math.cos(a) * r, 14 + Math.random() * 10, Math.sin(a) * r);
  scene.add(cloud);
}

// ---------- Welt ----------
const world = new THREE.Group();
scene.add(world);

const ISLAND_RADIUS = 22;
let islandGroup = null;
let stars = [];
let obstacles = [];
let holes = [];

function makeIsland(level) {
  if (islandGroup) world.remove(islandGroup);
  islandGroup = new THREE.Group();
  stars = [];
  obstacles = [];
  holes = [];

  // Inselplatte (unregelmäßiges Low-Poly-Profil)
  const segs = 28;
  const shape = new THREE.Shape();
  const radii = [];
  for (let i = 0; i < segs; i++) radii.push(ISLAND_RADIUS * (0.88 + Math.random() * 0.18));
  for (let i = 0; i <= segs; i++) {
    const a = (i / segs) * Math.PI * 2;
    const r = radii[i % segs];
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    i === 0 ? shape.moveTo(x, y) : shape.lineTo(x, y);
  }
  const islandGeo = new THREE.ExtrudeGeometry(shape, { depth: 3, bevelEnabled: false });
  const island = new THREE.Mesh(islandGeo, new THREE.MeshLambertMaterial({ color: 0x6abe4f, flatShading: true }));
  island.rotation.x = Math.PI / 2;
  island.receiveShadow = true;
  islandGroup.add(island);
  islandGroup.userData.radii = radii;
  islandGroup.userData.segs = segs;

  // Erdreich-Sockel
  const dirt = new THREE.Mesh(
    new THREE.CylinderGeometry(ISLAND_RADIUS * 0.7, ISLAND_RADIUS * 0.35, 5, 12),
    new THREE.MeshLambertMaterial({ color: 0x8a5a33, flatShading: true })
  );
  dirt.position.y = -5;
  islandGroup.add(dirt);

  // Löcher: mit Schwung überquerbar, sonst fällt man durch (ab Level 2)
  const holeCount = Math.max(0, level - 1) * 2;
  for (let i = 0; i < holeCount; i++) {
    const r = 1.5 + Math.random() * 1.0;
    const p = randomSpot(0.72, r + 1.5);
    holes.push({ x: p.x, z: p.z, r });
    const holeMesh = new THREE.Mesh(
      new THREE.CircleGeometry(r, 20),
      new THREE.MeshBasicMaterial({ color: 0x14301c })
    );
    holeMesh.rotation.x = -Math.PI / 2;
    holeMesh.position.set(p.x, 0.02, p.z);
    islandGroup.add(holeMesh);
  }

  // Deko: Bäume
  for (let i = 0; i < 10; i++) {
    const tree = new THREE.Group();
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.25, 0.35, 1.4, 6),
      new THREE.MeshLambertMaterial({ color: 0x7a4a26 })
    );
    trunk.position.y = 0.7;
    const crown = new THREE.Mesh(
      new THREE.ConeGeometry(1.1, 2.4, 7),
      new THREE.MeshLambertMaterial({ color: 0x2e8b3d, flatShading: true })
    );
    crown.position.y = 2.4;
    crown.castShadow = true;
    tree.add(trunk, crown);
    const p = randomSpot(0.85, 1.2);
    tree.position.set(p.x, 0, p.z);
    tree.userData.r = 0.6;
    islandGroup.add(tree);
    obstacles.push(tree);
  }

  // Hindernisse: Felsen (mehr pro Level)
  const rockCount = 3 + level * 2;
  for (let i = 0; i < rockCount; i++) {
    const rock = new THREE.Mesh(
      new THREE.DodecahedronGeometry(0.8 + Math.random() * 0.7, 0),
      new THREE.MeshLambertMaterial({ color: 0x8d8d8d, flatShading: true })
    );
    const p = randomSpot(0.8, 1.5);
    rock.position.set(p.x, 0.6, p.z);
    rock.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
    rock.castShadow = true;
    rock.userData.r = rock.geometry.parameters.radius * 0.9;
    islandGroup.add(rock);
    obstacles.push(rock);
  }

  // Sterne zum Einsammeln
  const starCount = 8 + level * 3;
  const starGeo = makeStarGeometry();
  for (let i = 0; i < starCount; i++) {
    const star = new THREE.Mesh(starGeo, new THREE.MeshLambertMaterial({ color: 0xffd23f, emissive: 0x806000 }));
    const p = randomSpot(0.9, 1.0);
    star.position.set(p.x, 1.1, p.z);
    star.castShadow = true;
    islandGroup.add(star);
    stars.push(star);
  }

  world.add(islandGroup);
  return starCount;
}

function makeStarGeometry() {
  const shape = new THREE.Shape();
  const outer = 0.7, inner = 0.3, points = 5;
  for (let i = 0; i < points * 2; i++) {
    const r = i % 2 === 0 ? outer : inner;
    const a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    i === 0 ? shape.moveTo(x, y) : shape.lineTo(x, y);
  }
  return new THREE.ExtrudeGeometry(shape, { depth: 0.25, bevelEnabled: false });
}

// Zufälliger Punkt auf der Insel, mit Mindestabstand zu Löchern
function randomSpot(maxFrac, holeClearance) {
  for (let tries = 0; tries < 200; tries++) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.sqrt(Math.random()) * ISLAND_RADIUS * maxFrac;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (Math.hypot(x, z) < 4) continue;
    if (!insideIsland(x, z, 1.5)) continue;
    if (holes.some(h => Math.hypot(x - h.x, z - h.z) < h.r + holeClearance)) continue;
    return { x, z };
  }
  return { x: 5, z: 5 };
}

// Liegt (x,z) innerhalb der unregelmäßigen Inselkante (minus Rand `margin`)?
function insideIsland(x, z, margin = 0) {
  const radii = islandGroup.userData.radii;
  const segs = islandGroup.userData.segs;
  const d = Math.hypot(x, z);
  if (d < 0.001) return true;
  // ExtrudeGeometry liegt in XY und wird um +90° auf XZ gedreht => y-Achse wird zu -z
  let a = Math.atan2(-z, x);
  if (a < 0) a += Math.PI * 2;
  const fi = (a / (Math.PI * 2)) * segs;
  const i0 = Math.floor(fi) % segs;
  const i1 = (i0 + 1) % segs;
  const edge = radii[i0] + (radii[i1] - radii[i0]) * (fi - Math.floor(fi));
  return d < edge - margin;
}

// Boden unter (x,z)? Inselkante UND Löcher beachten (kleines Leeway am Lochrand)
function onGround(x, z) {
  if (!insideIsland(x, z, 0)) return false;
  return !holes.some(h => Math.hypot(x - h.x, z - h.z) < h.r - 0.25);
}

// ---------- Spielfigur ----------
const player = new THREE.Group();
{
  const bodyMat = new THREE.MeshLambertMaterial({ color: 0xf5e6d3 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(1, 0.9, 1.5), bodyMat);
  body.position.y = 0.85;
  body.castShadow = true;
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.7, 0.6), bodyMat);
  head.position.set(0, 1.6, 0.75);
  head.castShadow = true;
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
  for (const sx of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 6), eyeMat);
    eye.position.set(sx * 0.18, 1.7, 1.06);
    player.add(eye);
  }
  const legMat = new THREE.MeshLambertMaterial({ color: 0xd9c4a9 });
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.5, 0.25), legMat);
    leg.position.set(sx * 0.32, 0.25, sz * 0.5);
    player.add(leg);
  }
  player.add(body, head);
}
world.add(player);

// ---------- Spielzustand ----------
const state = {
  running: false,
  level: 1,
  lives: 3,
  collected: 0,
  total: 0,
  pos: new THREE.Vector2(0, 0),   // x/z auf der Insel
  vel: new THREE.Vector2(0, 0),
  y: 0,
  air: false,
  fallVel: 0,
  invincibleUntil: 0,
};

// ---------- Steuerung: Swipe = Weltverschiebung ----------
// Fingerbewegung (Richtung + Länge + Geschwindigkeit) wird direkt in Bewegung
// übersetzt. SLIDE_WORLD: Welt wird gezogen, Figur rutscht entgegengesetzt.
// CONTROL_CHARACTER: Figur folgt dem Finger. Tap = sofortiger Stopp.
const MODES = { SLIDE_WORLD: -1, CONTROL_CHARACTER: 1 };
let mode = MODES.SLIDE_WORLD;

const SENSITIVITY = 1.15;
const MAX_SPEED = 32;
const FRICTION = 2.0;       // Ausrollen nach dem Swipe
const GRAV = 30;
const DRAG_FOLLOW = 22;     // wie direkt die Figur dem Finger folgt (am Boden)
const AIR_FOLLOW = 5;       // Luftkontrolle: Richtung in der Luft beeinflussbar
const TAP_MAX_DIST = 12;    // px
const TAP_MAX_TIME = 250;   // ms

const drag = { active: false, dx: 0, dy: 0, startX: 0, startY: 0, startT: 0, totalDist: 0 };

function px2world() { return 30 / Math.min(innerWidth, innerHeight); }

renderer.domElement.addEventListener('pointerdown', e => {
  drag.active = true;
  drag.dx = drag.dy = drag.totalDist = 0;
  drag.startX = e.clientX; drag.startY = e.clientY;
  drag.startT = performance.now();
});
addEventListener('pointermove', e => {
  if (!drag.active) return;
  drag.dx += e.movementX ?? 0;
  drag.dy += e.movementY ?? 0;
  drag.totalDist = Math.max(drag.totalDist, Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY));
});
function endDrag() {
  if (!drag.active) return;
  drag.active = false;
  // Tap: Figur stoppt "on a dime"
  if (drag.totalDist < TAP_MAX_DIST && performance.now() - drag.startT < TAP_MAX_TIME) {
    state.vel.set(0, 0);
  }
  // sonst: aktuelle (gesmoothte) Geschwindigkeit läuft als Momentum weiter
}
addEventListener('pointerup', endDrag);
addEventListener('pointercancel', endDrag);

// ---------- HUD ----------
const scoreBadge = document.getElementById('scoreBadge');
const levelBadge = document.getElementById('levelBadge');
const livesBadge = document.getElementById('livesBadge');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const modeBtn = document.getElementById('modeBtn');
const toast = document.getElementById('toast');

modeBtn.addEventListener('click', () => {
  mode = mode === MODES.SLIDE_WORLD ? MODES.CONTROL_CHARACTER : MODES.SLIDE_WORLD;
  modeBtn.textContent = mode === MODES.SLIDE_WORLD ? '🌍 Welt sliden' : '🐾 Figur steuern';
  showToast(mode === MODES.SLIDE_WORLD ? 'Du ziehst die Welt unter der Figur weg' : 'Die Figur folgt deinem Finger');
});

function updateHUD() {
  scoreBadge.textContent = `⭐ ${state.collected} / ${state.total}`;
  levelBadge.textContent = `Level ${state.level}`;
  livesBadge.textContent = '❤️'.repeat(Math.max(0, state.lives)) || '💀';
}

let toastTimer = 0;
function showToast(msg) {
  toast.textContent = msg;
  toast.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (toast.style.opacity = 0), 1600);
}

function startLevel(level) {
  state.level = level;
  state.total = makeIsland(level);
  state.collected = 0;
  respawn();
  updateHUD();
}

function respawn() {
  state.pos.set(0, 0);
  state.vel.set(0, 0);
  state.y = 0;
  state.air = false;
  state.fallVel = 0;
  state.invincibleUntil = performance.now() + 1500;
  player.position.set(0, 0, 0);
  player.rotation.x = 0;
}

function startGame() {
  state.lives = 3;
  overlay.classList.add('hidden');
  state.running = true;
  startLevel(1);
}

function gameOver(won) {
  state.running = false;
  overlay.classList.remove('hidden');
  overlay.querySelector('h1').textContent = won ? '🎉 Geschafft!' : '💧 Platsch!';
  overlay.querySelectorAll('p')[0].textContent = won
    ? `Alle Level gemeistert! Du hast es bis Level ${state.level} geschafft.`
    : `Du bist in Level ${state.level} abgestürzt. Sterne gesammelt: ${state.collected}.`;
  overlay.querySelectorAll('p')[1].textContent = '';
  startBtn.textContent = 'Nochmal spielen';
}

startBtn.addEventListener('click', startGame);

// ---------- Physik & Loop ----------
const clock = new THREE.Clock();

function step(dt) {
  if (!state.running) return;

  // --- Input: Finger-Delta dieses Frames -> Zielgeschwindigkeit ---
  if (drag.active) {
    const s = px2world() * SENSITIVITY * mode; // SLIDE_WORLD invertiert
    const targetVx = (drag.dx * s) / dt;
    const targetVz = (drag.dy * s) / dt;
    drag.dx = drag.dy = 0;
    // Am Boden folgt die Figur dem Finger fast direkt (virtueller Joystick),
    // in der Luft nur abgeschwächt (Richtungskorrektur im Sprung)
    const follow = Math.min(1, (state.air ? AIR_FOLLOW : DRAG_FOLLOW) * dt);
    state.vel.x += (targetVx - state.vel.x) * follow;
    state.vel.y += (targetVz - state.vel.y) * follow;
  } else if (!state.air) {
    // Momentum rollt aus
    state.vel.multiplyScalar(Math.max(0, 1 - FRICTION * dt));
    if (state.vel.lengthSq() < 0.01) state.vel.set(0, 0);
  }
  if (state.vel.length() > MAX_SPEED) state.vel.setLength(MAX_SPEED);

  // --- Vertikal: fallen / landen ---
  if (state.air) {
    state.fallVel += GRAV * dt;
    state.y -= state.fallVel * dt;
    player.rotation.x += dt * 3;
    // Mit genug Schwung über die Lücke: knapp unter Kante noch landen (Leeway)
    if (state.y > -1.3 && onGround(state.pos.x, state.pos.y)) {
      state.y = 0;
      state.air = false;
      state.fallVel = 0;
      player.rotation.x = 0;
    }
    if (state.y < -12) {
      state.lives--;
      updateHUD();
      if (state.lives <= 0) { gameOver(false); return; }
      showToast('Autsch! Noch ' + state.lives + ' ❤️');
      respawn();
      return;
    }
  }

  // --- Horizontal bewegen (mit Hindernis-Kollision, nur nahe Bodenhöhe) ---
  const nx = state.pos.x + state.vel.x * dt;
  const nz = state.pos.y + state.vel.y * dt;
  let blocked = false;
  if (state.y > -0.6) {
    for (const ob of obstacles) {
      const dx = nx - ob.position.x, dz = nz - ob.position.z;
      const minD = ob.userData.r + 0.55;
      if (dx * dx + dz * dz < minD * minD) {
        const d = Math.max(0.001, Math.hypot(dx, dz));
        const push = (minD - d) + 0.02;
        state.pos.x += (dx / d) * push;
        state.pos.y += (dz / d) * push;
        const dot = state.vel.x * (dx / d) + state.vel.y * (dz / d);
        if (dot < 0) {
          state.vel.x -= 1.6 * dot * (dx / d);
          state.vel.y -= 1.6 * dot * (dz / d);
        }
        blocked = true;
        break;
      }
    }
  }
  if (!blocked) { state.pos.x = nx; state.pos.y = nz; }

  // --- Boden verlassen? (Kante oder Loch) ---
  if (!state.air && !onGround(state.pos.x, state.pos.y) && performance.now() > state.invincibleUntil) {
    state.air = true;
    state.fallVel = 0; // horizontaler Schwung bleibt erhalten -> Lücken überspringbar
  }

  player.position.set(state.pos.x, state.y, state.pos.y);

  // Blickrichtung
  if (!state.air && state.vel.lengthSq() > 0.05) {
    const target = Math.atan2(state.vel.x, state.vel.y);
    let diff = target - player.rotation.y;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    player.rotation.y += diff * Math.min(1, 10 * dt);
  }

  // Sterne einsammeln
  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i];
    const dx = state.pos.x - s.position.x, dz = state.pos.y - s.position.z;
    if (dx * dx + dz * dz < 1.3 && state.y > -0.6) {
      islandGroup.remove(s);
      stars.splice(i, 1);
      state.collected++;
      updateHUD();
      if (state.collected >= state.total) {
        if (state.level >= 5) { gameOver(true); return; }
        showToast('Level ' + (state.level + 1) + '! 🎉');
        startLevel(state.level + 1);
      }
    }
  }

  // Kosmetisches Mit-Kippen der Welt in Bewegungsrichtung ("die Welt schiebt")
  world.rotation.z = THREE.MathUtils.lerp(world.rotation.z, -state.vel.x * 0.0035, Math.min(1, 6 * dt));
  world.rotation.x = THREE.MathUtils.lerp(world.rotation.x, state.vel.y * 0.0035, Math.min(1, 6 * dt));
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  step(dt);

  // Sterne drehen & schweben
  const t = performance.now() / 1000;
  for (const s of stars) {
    s.rotation.y = t * 2;
    s.position.y = 1.1 + Math.sin(t * 3 + s.position.x) * 0.15;
  }

  // Kamera folgt der Figur -> die Figur bleibt im Bild, die Welt "slidet" darunter
  const wp = new THREE.Vector3();
  player.getWorldPosition(wp);
  camera.position.lerp(new THREE.Vector3(wp.x, Math.max(wp.y, -2) + 16, wp.z + 14), 0.1);
  camera.lookAt(wp.x, Math.max(wp.y, -4), wp.z);

  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Insel schon im Startbildschirm zeigen
makeIsland(1);
updateHUD();
animate();
</script>
</body>
</html>
